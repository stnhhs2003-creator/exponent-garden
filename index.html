const $=id=>document.getElementById(id),cv=$('arena'),c=cv.getContext('2d'),keys=['easy','normal','hard'],titles=['晨光草坪 · 同底數乘除','夕陽花圃 · 乘方與乘積','月夜庭園 · 指數混合'],store='exponent-garden-v1';let saved;try{saved=JSON.parse(localStorage.getItem(store))||{}}catch{saved={}}saved.badges||=[];saved.seen||={};saved.rank||=[];$('name').value=saved.name||'';
let g=null,kind='pea',last=0,muted=false,audio=null,melody=0,nextNote=0;function save(){try{localStorage.setItem(store,JSON.stringify(saved))}catch{}}function tone(f,d=.15,type='sine',v=.04){if(muted||!audio)return;let o=audio.createOscillator(),a=audio.createGain();o.type=type;o.frequency.value=f;a.gain.setValueAtTime(v,audio.currentTime);a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(a);a.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}function unlock(){audio||=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}
function math(t){return String(t).replace(/\^(\d+|□)/g,'<sup>$1</sup>')}function menu(){if(g)g.paused=true;$('chapters').replaceChildren();titles.forEach((t,i)=>{let b=document.createElement('button');b.textContent=(saved.badges.includes(i)?'★ 已通關　':'⚑ 挑戰　')+t+'｜2 條命・3 分鐘・闖入即死亡';b.onclick=()=>start(i);$('chapters').append(b)});$('rank').textContent='本機排行榜：'+saved.rank.slice(0,5).map((r,i)=>(i+1)+'. '+r.name+' '+r.score+'分').join(' ／ ');$('menu').showModal()}
function start(level){unlock();saved.name=$('name').value.trim()||'花園冒險者';let seen=saved.seen[keys[level]]||[],pool=BANK[keys[level]].filter(q=>!seen.includes(q.id));if(pool.length<10){pool=BANK[keys[level]];seen=[]}pool=[...pool].sort(()=>Math.random()-.5).slice(0,10);saved.seen[keys[level]]=[...seen,...pool.map(q=>q.id)];save();g={level,pool,i:0,lives:2,sun:100,time:180,plants:Array.from({length:5},(_,row)=>({row,col:0,x:200,y:163+row*65,type:"pea",cool:0})),zombies:[],shots:[],particles:[],ammo:6,combo:0,lane:2,mode:"aim",wave:25,flash:0,shake:0,bossSpawned:false,fireCD:0,spawn:3,elapsed:0,score:0,paused:false,ended:false};$('menu').close();$('message').close();showQ();hud();$('note').textContent='① 點草坪選步道　② 按紅色發射鈕！答對可補充彈藥。'}
function hud(){$('chapter').textContent=titles[g.level];$('lives').textContent='♥ '.repeat(g.lives)+'♡ '.repeat(2-g.lives);$('time').textContent=String(Math.floor(Math.ceil(g.time)/60)).padStart(2,'0')+':'+String(Math.ceil(g.time)%60).padStart(2,'0');$('sun').textContent='☀ '+g.sun;$('progress').textContent='第 '+Math.min(10,g.i+1)+' / 10 題'}function showQ(){if(g.i>=10){$('q').textContent='守關 Boss 登場！點選步道、按紅色按鈕集中炮擊！';$('answers').replaceChildren();return}let q=g.pool[g.i];$('q').innerHTML=math(q.text);$('answers').replaceChildren();[...q.choices].sort(()=>Math.random()-.5).forEach(n=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>answer(n);$('answers').append(b)})}
function answer(n){if(!g||g.paused||g.ended)return;if(g.i>=10)return;let q=g.pool[g.i];if(n===q.ans){g.combo++;g.ammo+=3;g.sun+=80;g.score+=(100+g.combo*20)*(g.level+1);g.flash=.18;if(g.combo%3===0){g.ammo+=3;g.zombies.forEach(z=>{z.hp-=3;hit(z.x,z.y,"連擊爆發 −3")})}tone(660);setTimeout(()=>tone(880),90);g.zombies.forEach(z=>z.hp-=1);g.i++;if(g.i===10){spawnBoss();showQ();hud();return}showQ();$('note').textContent='答對！陽光 +80，所有殭屍受到星光傷害。'}else{g.combo=0;g.shake=.6;g.flash=.5;g.lives--;tone(120,.4,'sawtooth');if(!g.lives){finish(false,'答錯兩題。正確答案：'+q.ans+'。'+q.steps[0]);return}g.paused=true;$('retry').hidden=true;$('message').classList.remove('defeat');$('msgTitle').textContent='名師解題秘笈';$('msgBody').textContent='你選了 '+n+'，正確答案是 '+q.ans+'。'+q.steps[0];$('continue').textContent='看懂了，下一題';$('continue').onclick=()=>{$('message').close();g.i++;if(g.i===10){g.paused=false;spawnBoss();showQ()}else{g.paused=false;showQ()}};$('message').showModal()}hud()}
function finish(win,reason=''){g.ended=true;g.paused=true;if(win){if(!saved.badges.includes(g.level))saved.badges.push(g.level);saved.rank.push({name:saved.name,score:g.score+Math.ceil(g.time)*2});saved.rank.sort((a,b)=>b.score-a.score);saved.rank=saved.rank.slice(0,20);save();[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.4),i*140))}else tone(75,.9,'triangle');$('retry').hidden=win;$('retry').onclick=()=>start(g.level);$('message').classList.toggle('defeat',!win);$('msgTitle').textContent=win?(saved.badges.length===3?'🏆 三關全過！花園冠軍':'🌟 花園守護成功'):'💀 花園失守';$('msgBody').textContent=win?'完成本章 10 題！已保存星光徽章與本機分數。':'本關死亡：'+reason+' 每關獨立計算；重新挑戰會恢復 2 條命、3 分鐘，並重新抽題。其他已通關徽章保留。';$('continue').textContent='返回地圖・重新選關';$('continue').onclick=()=>{$('message').close();menu()};$('message').showModal()}
['pea','ice'].forEach(k=>$(k).onclick=()=>{kind=k;if(g)g.mode='plant';$('pea').classList.toggle('selected',k==='pea');$('ice').classList.toggle('selected',k==='ice')});$('burst').onclick=()=>{if(!g||g.paused||g.sun<150)return;g.sun-=150;g.zombies.forEach(z=>z.hp-=6);tone(100,.5,'sawtooth');hud()};cv.onpointerdown=e=>{if(!g||g.paused)return;let r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*1200/r.width,y=(e.clientY-r.top)*480/r.height,col=Math.floor((x-150)/100),row=Math.floor((y-130)/65),cost=kind==='pea'?50:75;if(row<0||row>4)return;g.lane=row;if(g.mode==='aim'){tone(400,.06);$('note').textContent='已瞄準第 '+(row+1)+' 步道，按紅色按鈕發射！';return}if(col<0||col>7)return;if(g.plants.some(p=>p.row===row&&p.col===col))return;if(g.sun<cost){$('note').textContent='陽光不足，先答對題目！';return}g.sun-=cost;g.plants.push({row,col,x:200+col*100,y:163+row*65,type:kind,cool:0});g.mode='aim';$('pea').classList.remove('selected');$('ice').classList.remove('selected');tone(440,.1);hud()};$('home').onclick=menu;$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();$('music').onclick=()=>{unlock();muted=!muted;$('music').textContent='♫ 音樂：'+(muted?'關':'開')};
function oval(x,y,rx,ry,color){c.fillStyle=color;c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.fill()}function plant(x,y,t,type='pea'){c.save();c.translate(x,y);let sway=Math.sin(t*3+x)*2;c.translate(sway,0);oval(0,20,23,7,'#183e3340');c.strokeStyle='#36783c';c.lineWidth=7;c.beginPath();c.moveTo(0,17);c.lineTo(0,-14);c.stroke();oval(-13,6,16,7,'#69b84e');oval(13,11,17,7,'#3c9548');oval(-2,-18,24,22,type==='pea'?'#9bd96b':'#8ddadf');oval(20,-18,17,11,type==='pea'?'#70b94e':'#67b9d6');oval(30,-18,5,9,'#244a37');oval(-8,-23,3,5,'#183a2b');c.fillStyle='#d9b36b';c.fillRect(-25,-39,39,6);oval(-7,-42,15,7,'#eed28c');c.restore()}function zombie(z,t){c.save();c.translate(z.x,z.y);let walk=Math.sin(t*7+z.row);oval(0,25,20*z.scale,7,'#102b3240');c.scale(z.scale,z.scale);if(z.boss){oval(0,-40,30,10,'#d9a94a');c.fillStyle='#722b39';c.fillRect(-22,-55,44,18)}c.strokeStyle='#405064';c.lineWidth=9;for(let s of [-1,1]){c.beginPath();c.moveTo(s*7,8);c.lineTo(s*9+walk*s*7,24);c.stroke()}c.fillStyle='#a76d75';c.fillRect(-14,-14,28,29);c.strokeStyle='#a7b995';c.lineWidth=7;c.beginPath();c.moveTo(-10,-7);c.lineTo(-31,-3+walk*3);c.stroke();oval(0,-28,19,19,'#acc599');oval(-8,-30,5,6,'#f4eed7');oval(6,-30,5,6,'#f4eed7');oval(-9,-29,2,3,'#24372d');oval(5,-29,2,3,'#24372d');c.fillStyle='#4c644b';c.fillRect(-9,-18,17,3);if(z.scale>1.2){c.fillStyle='#b8ad7b';c.fillRect(-20,-53,40,10)}c.restore();if(z.maxHp){c.fillStyle='#293b32';c.fillRect(z.x-24,z.y-65,48,5);c.fillStyle=z.boss?'#f7b85e':'#dd6e72';c.fillRect(z.x-24,z.y-65,48*Math.max(0,z.hp/z.maxHp),5)}}
function render(t){let level=g?.level||0,sky=c.createLinearGradient(0,0,0,480);sky.addColorStop(0,['#8dd5e8','#e8b39c','#263d67'][level]);sky.addColorStop(1,['#e9f1c1','#f5deb3','#688d85'][level]);c.fillStyle=sky;c.fillRect(0,0,1200,480);oval(1040,48,28,28,level===2?'#fff4ba':'#fff0a3');for(let i=0;i<12;i++){c.fillStyle=level===2?'#d8ddc6':'#91b7aa';c.fillRect(i*110,60-i%3*12,65,80)}c.fillStyle='#f2e3b2';c.fillRect(0,115,1200,25);for(let x=10;x<1200;x+=36){c.fillStyle='#ffedcc';c.fillRect(x,92,9,55)}c.fillStyle='#74a85e';c.fillRect(0,140,1200,340);for(let r=0;r<5;r++)for(let k=0;k<8;k++){c.fillStyle=(r+k)%2?'#a6cd79':'#b7db87';if(level===2)c.fillStyle=(r+k)%2?'#4a795f':'#56876b';c.fillRect(150+k*100,130+r*65,98,63)}c.fillStyle='#dcbf85';c.fillRect(960,140,240,340);c.fillStyle='#fff3cf';c.fillRect(20,148,100,240);c.fillStyle='#ce7664';c.beginPath();c.moveTo(5,150);c.lineTo(70,105);c.lineTo(132,150);c.fill();c.fillStyle='#42764f';c.fillRect(50,300,35,88);plant(73,245,t);c.fillStyle='#34533b';c.font='bold 16px system-ui';c.fillText('守衛小屋',28,420);if(g){drawCombat(t);g.plants.forEach(p=>plant(p.x,p.y,t,p.type));g.zombies.forEach(z=>zombie(z,t));g.shots.forEach(s=>oval(s.x,s.y,9,7,s.ice?'#a7f3ff':'#e8f58a'))}else{plant(300,225,t);plant(500,355,t,'ice');zombie({x:1000,y:225,row:0,scale:1},t)} }
function frame(ms){let dt=Math.min(.05,(ms-last)/1000||0);last=ms;if(g&&!g.paused&&!g.ended){g.time-=dt;g.elapsed+=dt;g.spawn-=dt;g.wave-=dt;g.fireCD=Math.max(0,g.fireCD-dt);g.flash=Math.max(0,g.flash-dt);g.shake=Math.max(0,g.shake-dt);if(g.wave<=0&&!g.bossSpawned){for(let r=0;r<5;r++)spawnZombie(r,r%2===0);g.wave=25;tone(95,.6,'sawtooth');$('note').textContent='⚠ 屍潮來襲！五路接敵，連答補彈！'}if(g.time<=0){g.time=0;finish(false,'超過 3 分鐘。')}else{if(g.spawn<=0){let row=Math.floor(Math.random()*5);if(!g.bossSpawned)spawnZombie(row,Math.random()<.3);g.spawn=7-g.level}g.plants.forEach(p=>{p.cool-=dt;if(p.cool<=0&&g.zombies.some(z=>z.row===p.row&&z.x>p.x)){g.shots.push({x:p.x+30,y:p.y-18,row:p.row,ice:p.type==='ice'});p.cool=p.type==='ice'?1.8:1.25;tone(280,.045,'triangle',.012)}});g.zombies.forEach(z=>{z.slow=Math.max(0,z.slow-dt);let blocker=g.plants.find(p=>p.row===z.row&&Math.abs(p.x-z.x)<32);if(blocker){blocker.health=(blocker.health??4)-dt;if(blocker.health<=0)g.plants=g.plants.filter(p=>p!==blocker)}else z.x-=dt*(z.speed||18+g.level*4)*(z.slow? .45:1)*(z.boss&&Math.sin(g.elapsed*1.4)> .9?2.8:1);if(z.x<140&&!g.ended)finish(false,'殭屍闖入守衛小屋。')});g.shots.forEach(s=>{s.x+=dt*400;let z=g.zombies.find(z=>z.row===s.row&&Math.abs(z.x-s.x)<28);if(z){z.hp-=s.power||1;hit(z.x,z.y,'−'+(s.power||1));tone(140,.06,'square',.018);if(s.ice)z.slow=3;s.x=1300}});g.shots=g.shots.filter(s=>s.x<1200);g.zombies=g.zombies.filter(z=>{if(z.hp<=0){hit(z.x,z.y,'擊退！');g.score+=20*(g.level+1);if(z.boss){finish(true);return false}return false}return true});g.particles.forEach(p=>p.life-=dt);g.particles=g.particles.filter(p=>p.life>0);hud();combatHud()}}if(audio&&!muted&&g&&!g.paused&&ms>nextNote){tone([261,329,392,329,293,349,440,392][melody++%8]*(g.i>7?1.25:1),.25,'triangle',.025);nextNote=ms+420}c.save();if(g?.shake)c.translate(Math.sin(ms*.09)*6,0);render(ms/1000);if(g?.flash){c.fillStyle='rgba(255,210,120,'+g.flash*.5+')';c.fillRect(0,0,1200,480)}c.restore();requestAnimationFrame(frame)}
function hit(x,y,text){g.particles.push({x,y,text,life:1})}
function spawnZombie(row,fast=false){g.zombies.push({x:1160,y:163+row*65,row,hp:fast?3:5,maxHp:fast?3:5,scale:fast?.9:1.1,slow:0,speed:fast?34+g.level*4:18+g.level*3})}
function spawnBoss(){g.bossSpawned=true;g.paused=false;g.ammo+=18;g.zombies=[];g.zombies.push({x:1120,y:293,row:2,hp:30+g.level*10,maxHp:30+g.level*10,scale:1.65,boss:true,speed:12,slow:0});g.lane=2;g.mode='aim';g.flash=.5;$('note').textContent='⚠ 巨型園丁 Boss 登場！額外獲得 18 發炮彈，瞄準第三步道！';tone(80,.7,'sawtooth')}
function combatHud(){$('combo').textContent='連擊 '+g.combo;$('ammo').textContent='能量彈 '+g.ammo;$('wave').textContent=g.bossSpawned?'⚠ BOSS 衝鋒中':'屍潮倒數 '+Math.ceil(g.wave)+' 秒';$('fire').disabled=g.ammo<=0||g.paused;}
function fire(){if(!g||g.paused||g.ended||g.fireCD>0)return;if(g.ammo<1){$('note').textContent='能量彈不足，答對題目補充 3 發！';return}g.ammo--;g.fireCD=.22;g.shots.push({x:150,y:145+g.lane*65,row:g.lane,power:3});g.shake=.12;tone(100,.16,'sawtooth',.07);tone(420,.08,'square',.025);combatHud()}
$('fire').onclick=()=>{if(g)g.mode='aim';$('pea').classList.remove('selected');$('ice').classList.remove('selected');fire()};document.addEventListener('keydown',e=>{if(!g||g.paused||e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();fire()}if(e.code==='ArrowUp'||e.code==='ArrowDown'){e.preventDefault();g.lane=Math.max(0,Math.min(4,g.lane+(e.code==='ArrowUp'?-1:1)))}});
function drawCombat(t){c.fillStyle='#f9cf4930';c.fillRect(150,130+g.lane*65,810,63);c.strokeStyle='#ffe290';c.lineWidth=3;c.strokeRect(150,130+g.lane*65,810,63);let y=163+g.lane*65;oval(133,y+16,29,10,'#233c3d90');c.fillStyle='#31585e';c.fillRect(100,y-24,50,36);c.fillStyle='#f2c25c';c.fillRect(124,y-18,47,16);c.fillStyle='#172c35';c.fillRect(163,y-18,10,16);c.fillStyle='#fff0b3';c.font='bold 20px system-ui';c.fillText('▶',175,y+7);g.particles.forEach(p=>{c.fillStyle='#fff9ae';c.font='bold 25px system-ui';c.strokeStyle='#26402f';c.lineWidth=4;c.strokeText(p.text,p.x-20,p.y-45-(1-p.life)*40);c.fillText(p.text,p.x-20,p.y-45-(1-p.life)*40)});if(g.wave<5&&!g.bossSpawned){c.fillStyle='#a62d38d9';c.fillRect(350,35,520,55);c.fillStyle='white';c.font='bold 30px system-ui';c.fillText('⚠ 屍潮將至：'+Math.ceil(g.wave),400,72)}if(g.bossSpawned){let z=g.zombies.find(z=>z.boss);if(z){c.fillStyle='#2b2731';c.fillRect(360,35,500,30);c.fillStyle='#ee795c';c.fillRect(360,35,500*Math.max(0,z.hp/z.maxHp),30);c.fillStyle='white';c.font='bold 20px system-ui';c.fillText('巨型園丁 BOSS',510,58)}}}

requestAnimationFrame(frame);menu();
</script></html>
